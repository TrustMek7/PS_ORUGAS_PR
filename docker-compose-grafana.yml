version: '3.8'
services:
  # InfluxDB - Base de datos de series temporales para métricas k6
  influxdb:
    image: influxdb:2.0
    container_name: ps_orugas_influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=password123
      - DOCKER_INFLUXDB_INIT_ORG=ps-orugas-org
      - DOCKER_INFLUXDB_INIT_BUCKET=k6-metrics
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - ./influxdb-config:/etc/influxdb2
    networks:
      - monitoring

  # Grafana - Dashboard para visualización
  grafana:
    image: grafana/grafana:latest
    container_name: ps_orugas_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_INSTALL_PLUGINS=grafana-influxdb-08-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning
    depends_on:
      - influxdb
    networks:
      - monitoring

  # Prometheus (alternativo a InfluxDB)
  prometheus:
    image: prom/prometheus:latest
    container_name: ps_orugas_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - monitoring

volumes:
  influxdb_data:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  monitoring:
    driver: bridge

# ================================================================================
# INSTRUCCIONES DE USO:
#
# 1. Levantar servicios:
#    docker-compose -f docker-compose-grafana.yml up -d
#
# 2. Acceder a Grafana:
#    http://localhost:3000 (admin/admin123)
#
# 3. Acceder a InfluxDB:
#    http://localhost:8086 (admin/password123)
#
# 4. Ejecutar scripts k6:
#    k6 run --out influxdb=http://localhost:8086/k6 tests/script.js
#
# 5. Ver métricas en tiempo real en Grafana
# ================================================================================
